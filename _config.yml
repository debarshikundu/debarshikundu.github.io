# --- Site Info ---
title: "Debarshi Kundu"
author: "Debarshi Kundu"
description: "Personal website & technical blog."

# --- Custom Domain Settings ---
url: "https://www.autistictechboy.tech"
baseurl: ""

# --- Navigation Bar Links ---
navbar-links:
  About: "aboutme"
  Posts: "index"

# --- Avatar & Header Image ---
# Place an image file in assets/img/ to update this icon
avatar: "/assets/img/avatar-icon.png"
# Round the avatar image? (true/false)
round-avatar: true

# --- Social Profiles (Footer Links) ---
social-network-links:
  github: "debarshikundu"
  # linkedin: "your-linkedin-id"
  # email: "your-email@example.com"

# --- Jekyll & Build Settings ---
markdown: kramdown
highlighter: rouge

# Exclude unneeded local files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md

plugins:
  - jekyll-paginate
  - jekyll-sitemap